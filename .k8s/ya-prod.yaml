global:
  vault:
    addr: "https://vault.yc.prod.infra.sravni.market/"
    role: "sravni-prod-k8s-workloads"
    path: "sravni-prod-k8s-workloads"
  image:
    repository: registry.yc.prod.infra.sravni.market/bearlake_prod
    tag: ""
  imagePullSecrets:
    - harbor-pull-secret

app:
  team: bearlake
  port: 9034
  probes:
    livenessPath: "/internal/health"
    readinessPath: "/internal/health"
    initialDelaySeconds: 30
  metrics:
    path: "/internal/metrics"
  env:
    - name: SERVICE_NAME
      value: "autosend-service"
    - name: PORT
      value: "9034"
    - name: NODE_ENV
      value: "production"
    - name: ENV
      value: "production"
    - name: DEBUG_LOG
      value: "false"
    - name: CLIENT_ID
      value: vault:secrets/data/bearlake/wayback/identity#client
    - name: CLIENT_SECRET
      value: vault:secrets/data/bearlake/wayback/identity#secret
    - name: CREDIT_SELECTION_HOST
      value: "https://creditselection.svc.bearlake.prod-sravni.lan"
    - name: ISSUER_HOST
      value: "https://sravni.id"
    - name: CUSTOMER_HOST
      value: "https://cs-customer.svc.bearlake.prod-sravni.lan"
    - name: REDIS_PASSWORD
      value: vault:secrets/data/bearlake/redis/prod-yc-bearlake-redis-common#passwd
    - name: REDIS_HOSTNAME
      value: vault:secrets/data/bearlake/redis/prod-yc-bearlake-redis-common#hostname
    - name: REDIS_PORT
      value: vault:secrets/data/bearlake/redis/prod-yc-bearlake-redis-common#port
    - name: JAEGER_AGENT_HOST
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: JAEGER_AGENT_PORT
      value: '6832'

replicaCount: 4

resources:
  cpu: 50m
  memory: 150Mi

ingresses:
  - host: autosend.svc.bearlake.prod-sravni.lan
    ssl: enabled
    class: "internal"
    paths:
      - /

slos:
  - name: http_sli
    objective: 95
    totalQuery: sum(rate(http_requests_total{k8s=~"sravni-prod", service="autosend-service"}[{{.window}}]))
    errorQuery: sum(rate(http_requests_total{k8s=~"sravni-prod", service="autosend-service", status_code=~"5.."}[{{.window}}]))
    description: SLI по http вызовам
