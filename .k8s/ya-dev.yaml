global:
  vault:
    addr: "https://vault.yc.dev.infra.sravni-team.ru/"
    role: "sravni-prod-k8s-workloads"
    path: "sravni-prod-k8s-workloads"
  image:
    repository: registry.yc.prod.infra.sravni.market/bearlake_dev
    tag: ""
  imagePullSecrets:
    - harbor-pull-secret

app:
  team: bearlake
  port: 9034
  probes:
    livenessPath: "/internal/health"
    readinessPath: "/internal/health"
    initialDelaySeconds: 10
  env:
    - name: SERVICE_NAME
      value: "autosend-service"
    - name: PORT
      value: "9034"
    - name: NODE_ENV
      value: "stage"
    - name: ENV
      value: "stage"
    - name: DEBUG_LOG
      value: "false"
    - name: CLIENT_ID
      value: "wayback.service"
    - name: CLIENT_SECRET
      value: vault:secrets/data/bearlake/dev/wayback-service#client_secret
    - name: CREDIT_SELECTION_HOST
      value: "https://creditselection.svc.bearlake.dev.lan"
    - name: ISSUER_HOST
      value: "https://id.master.sravni.tech"
    - name: CUSTOMER_HOST
      value: "https://cs-customer.svc.bearlake.dev.lan"
    - name: REDIS_PASSWORD
      value: vault:secrets/data/bearlake/redis/prod-yc-bearlake-redis-common#passwd
    - name: REDIS_HOSTNAME
      value: vault:secrets/data/bearlake/redis/prod-yc-bearlake-redis-common#hostname
    - name: REDIS_PORT
      value: vault:secrets/data/bearlake/redis/prod-yc-bearlake-redis-common#port
    - name: JAEGER_AGENT_HOST
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: JAEGER_AGENT_PORT
      value: '6832'


ingresses:
- host: '{{ if ne .Values.Branch "master" }}{{ .Values.Branch }}.{{ end }}autosend.svc.bearlake.dev.lan'
  ssl: enabled
  class: internal
  paths:
  - /

replicaCount: 1

resources:
  cpu: 50m
  memory: 150Mi
